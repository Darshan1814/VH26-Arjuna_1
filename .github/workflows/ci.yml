name: CI/CD Pipeline - Quality & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST & LINTING
  # ---------------------------------------------------------------------------
  test-and-lint:
    name: Backend & Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8

      - name: Run Backend Tests with Coverage
        run: |
          pytest --cov=backend/app --cov-report=xml:backend/coverage.xml backend/tests/

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Lint
        run: |
          cd frontend
          npm ci
          npm run lint

  # ---------------------------------------------------------------------------
  # 2. SONARQUBE CODE QUALITY GATE
  # ---------------------------------------------------------------------------
  sonarqube:
    name: SonarQube Code Quality Analysis
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. TRIVY SECURITY & VULNERABILITY SCAN
  # ---------------------------------------------------------------------------
  security-scan:
    name: Trivy Security & Vulnerability Scan
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Build Docker Container Images
        run: |
          docker compose build

      - name: Run Trivy Container Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "mt-backend:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
