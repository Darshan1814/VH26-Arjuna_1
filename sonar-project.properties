# SonarQube Project Configuration
sonar.projectKey=industrial-rag
sonar.projectName=Industrial RAG Troubleshooter
sonar.projectVersion=1.0

# Source & Test paths
sonar.sources=backend/app,frontend/app,frontend/components,frontend/lib
sonar.tests=backend/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/model_cache/**,**/__pycache__/**,**/*.pyc,helm/**,database/**,manuals/**,public/**
sonar.test.inclusions=**/*test*/**,**/*_test.py,**/test_*.py

# Language specifications
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
