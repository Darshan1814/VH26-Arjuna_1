# =============================================================================
# SonarQube Code Quality Configuration
# Industrial Machine Troubleshooting System
# =============================================================================

sonar.projectKey=industrial-machine-troubleshooting-system
sonar.projectName=Industrial Machine Troubleshooting System
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=backend/app,frontend/app,frontend/components,frontend/lib
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/.next/**,**/model_cache/**,**/manuals/**,**/coverage/**,**/*.spec.ts

# Language & Environment
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.javascript.environments=nodejs

# Test Coverage & Linting reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Quality Gate enforcement
sonar.qualitygate.wait=true
