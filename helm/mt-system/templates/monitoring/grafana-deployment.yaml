{{- if .Values.monitoring.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mt-system.fullname" . }}-grafana
  labels:
    app.kubernetes.io/component: monitoring-grafana
    {{- include "mt-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: monitoring-grafana
      app.kubernetes.io/name: {{ include "mt-system.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: monitoring-grafana
        app.kubernetes.io/name: {{ include "mt-system.name" . }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.monitoring.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.monitoring.grafana.adminPassword | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/etc/grafana/dashboards/api-and-rag-overview.json"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: {{ include "mt-system.fullname" . }}-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: {{ include "mt-system.fullname" . }}-grafana-dashboards-config
        - name: dashboards
          configMap:
            name: {{ include "mt-system.fullname" . }}-grafana-dashboards
{{- end }}
