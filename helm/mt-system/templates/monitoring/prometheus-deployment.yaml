{{- if .Values.monitoring.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mt-system.fullname" . }}-prometheus
  labels:
    app.kubernetes.io/component: monitoring-prometheus
    {{- include "mt-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: monitoring-prometheus
      app.kubernetes.io/name: {{ include "mt-system.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: monitoring-prometheus
        app.kubernetes.io/name: {{ include "mt-system.name" . }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/etc/prometheus/console_libraries"
            - "--web.console.templates=/etc/prometheus/consoles"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "mt-system.fullname" . }}-prometheus-config
        - name: storage-volume
          emptyDir: {}
{{- end }}
