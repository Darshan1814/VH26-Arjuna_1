apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mt-system.fullname" . }}-secrets
  labels:
    {{- include "mt-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default "" | quote }}
  GROQ_MODEL: {{ .Values.secrets.groqModel | default "qwen/qwen3.8-27b" | quote }}
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | default "" | quote }}
  SUPABASE_KEY: {{ .Values.secrets.supabaseKey | default "" | quote }}
  SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseKey | default "" | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | default "" | quote }}
  SUPABASE_STORAGE_BUCKET: {{ .Values.secrets.supabaseStorageBucket | default "manuals" | quote }}
  NEXT_PUBLIC_SUPABASE_URL: {{ .Values.secrets.supabaseUrl | default "" | quote }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseKey | default "" | quote }}
