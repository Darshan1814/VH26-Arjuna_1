apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mt-system.fullname" . }}-secrets
  labels:
    {{- include "mt-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- Groq LLM Inference ---
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default "" | quote }}
  GROQ_MODEL: {{ .Values.secrets.groqModel | default "qwen/qwen3.8-27b" | quote }}
  GROQ_FAST_MODEL: {{ .Values.secrets.groqFastModel | default "openai/gpt-oss-20b" | quote }}
  GROQ_REASONING_MODEL: {{ .Values.secrets.groqReasoningModel | default "openai/gpt-oss-120b" | quote }}
  GROQ_VISION_MODEL: {{ .Values.secrets.groqVisionModel | default "qwen/qwen3.8-27b" | quote }}

  # --- ElevenLabs Multilingual Voice AI ---
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenLabsApiKey | default "" | quote }}
  ELEVENLABS_VOICE_ID: {{ .Values.secrets.elevenLabsVoiceId | default "gHu9GtaHOXcSqFTK06ux" | quote }}
  ELEVENLABS_FALLBACK_VOICE_ID: {{ .Values.secrets.elevenLabsFallbackVoiceId | default "EXAVITQu4vr4xnSDxMaL" | quote }}
  ELEVENLABS_MODEL_ID: {{ .Values.secrets.elevenLabsModelId | default "eleven_multilingual_v2" | quote }}

  # --- Web Search (Optional) ---
  SERPER_API_KEY: {{ .Values.secrets.serperApiKey | default "" | quote }}

  # --- Supabase Cloud Sync (Optional — falls back to local SQLite) ---
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | default "" | quote }}
  SUPABASE_KEY: {{ .Values.secrets.supabaseKey | default "" | quote }}
  SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseKey | default "" | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | default "" | quote }}
  SUPABASE_PUBLISHABLE_KEY: {{ .Values.secrets.supabasePublishableKey | default "" | quote }}
  SUPABASE_SECRET_KEY: {{ .Values.secrets.supabaseSecretKey | default "" | quote }}
  SUPABASE_STORAGE_BUCKET: {{ .Values.secrets.supabaseStorageBucket | default "manuals" | quote }}

  # --- Frontend Public Supabase (passed to Next.js server at runtime) ---
  NEXT_PUBLIC_SUPABASE_URL: {{ .Values.secrets.supabaseUrl | default "" | quote }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseKey | default "" | quote }}
