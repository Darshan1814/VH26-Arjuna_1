# =============================================================================
# Machine Troubleshooter Helm Values
# =============================================================================

nameOverride: ""
fullnameOverride: "mt"

# -- Docker Registry --
registry: docker.io
imageCredentials:
  username: darshan11111

# -- Backend Configuration --
backend:
  replicaCount: 1
  image:
    repository: darshan11111/mt-backend
    tag: "latest"
    pullPolicy: Always
  service:
    type: NodePort
    port: 8000
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1500m
      memory: 3072Mi
  hpa:
    enabled: false          # Disabled: HPA needs metrics-server; enable after cluster is stable
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 85
  # Long startup probes - backend downloads ML models on first boot (~3-5 min)
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 300   # 5 min - wait for model download
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 6        # 6 * 30s = 3 min grace after first check
    readiness:
      path: /health
      initialDelaySeconds: 120   # 2 min initial wait
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 10       # 10 * 15s = 2.5 min grace
  env:
    BACKEND_HOST: "0.0.0.0"
    BACKEND_PORT: "8000"
    LOG_LEVEL: "info"
    EMBEDDING_MODEL: "BAAI/bge-m3"
    EMBEDDING_DIMENSION: "1024"
    RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
    HF_HOME: "/app/model_cache"

# -- Frontend Configuration --
frontend:
  replicaCount: 1
  image:
    repository: darshan11111/mt-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: NodePort
    port: 3000
    nodePort: 30000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: false          # Disabled until cluster is stable
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
  probes:
    liveness:
      path: /
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5

# -- Ingress --
ingress:
  enabled: true
  className: nginx
  host: mt.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

# -- Secrets (injected by Jenkins at deploy time via --set) --
secrets:
  # Groq LLM
  groqApiKey: ""
  groqModel: "qwen/qwen3.8-27b"
  groqFastModel: "openai/gpt-oss-20b"
  groqReasoningModel: "openai/gpt-oss-120b"
  groqVisionModel: "qwen/qwen3.8-27b"
  # ElevenLabs
  elevenLabsApiKey: ""
  elevenLabsVoiceId: "gHu9GtaHOXcSqFTK06ux"
  elevenLabsFallbackVoiceId: "EXAVITQu4vr4xnSDxMaL"
  elevenLabsModelId: "eleven_multilingual_v2"
  # Web search
  serperApiKey: ""
  # Supabase (optional - falls back to local SQLite)
  supabaseUrl: ""
  supabaseKey: ""
  supabaseServiceRoleKey: ""
  supabasePublishableKey: ""
  supabaseSecretKey: ""
  supabaseStorageBucket: "manuals"

# -- Persistent Volume Claims --
# storageClass: "" uses the cluster's default StorageClass (standard on Minikube, gp2 on EKS)
persistence:
  enabled: true
  storageClass: "standard"   # Minikube default; change to "" for EKS/auto
  accessMode: ReadWriteOnce
  size: 5Gi          # model_cache
  manualsSize: 5Gi   # uploaded manuals

# -- Observability (Disabled by default to save Minikube resources) --
monitoring:
  enabled: false     # Set to true once backend + frontend are confirmed healthy
  prometheus:
    image: prom/prometheus:v2.51.0
    port: 9090
    serviceType: NodePort
    nodePort: 30090
    scrapeInterval: 15s
  grafana:
    image: grafana/grafana:10.4.1
    port: 3000
    serviceType: NodePort
    nodePort: 30030
    adminUser: admin
    adminPassword: admin
